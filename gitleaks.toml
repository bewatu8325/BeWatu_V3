# sensors/gitleaks.toml
# Gitleaks configuration for BeWatu.
# Extends default rules with BeWatu-specific patterns.
# Place this file at the repo root as .gitleaks.toml in each of the three repos.

title = "BeWatu Gitleaks Config"

[extend]
useDefault = true

[[rules]]
id = "bewatu-firebase-service-account"
description = "Firebase service account JSON key"
regex = '''\"type\":\s*\"service_account\"'''
tags = ["firebase", "critical"]
severity = "CRITICAL"

[[rules]]
id = "bewatu-firebase-private-key"
description = "Firebase private key in PEM format"
regex = '''-----BEGIN (RSA )?PRIVATE KEY-----'''
tags = ["firebase", "critical"]
severity = "CRITICAL"

[[rules]]
id = "bewatu-vercel-token"
description = "Vercel API token"
regex = '''(?i)(vercel[_-]?token|VERCEL_TOKEN)\s*[:=]\s*['\"]?[A-Za-z0-9_-]{20,}['\"]?'''
tags = ["vercel"]
severity = "HIGH"

[[rules]]
id = "bewatu-stripe-live-key"
description = "Stripe live secret key"
regex = '''sk_live_[0-9a-zA-Z]{24,}'''
tags = ["stripe", "financial", "critical"]
severity = "CRITICAL"

[[rules]]
id = "bewatu-stripe-test-key"
description = "Stripe test secret key (still should not be committed)"
regex = '''sk_test_[0-9a-zA-Z]{24,}'''
tags = ["stripe"]
severity = "MEDIUM"

[[rules]]
id = "bewatu-resend-api-key"
description = "Resend API key"
regex = '''re_[A-Za-z0-9_]{20,}'''
tags = ["resend", "email"]
severity = "HIGH"

[[rules]]
id = "bewatu-anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{40,}'''
tags = ["anthropic", "ai"]
severity = "HIGH"

[[rules]]
id = "bewatu-otp-secret"
description = "OTP HMAC secret (high entropy string in OTP context)"
regex = '''(?i)(otp[_-]?secret|OTP_SECRET)\s*[:=]\s*['\"]?[A-Za-z0-9+/=]{32,}['\"]?'''
tags = ["otp", "auth"]
severity = "CRITICAL"

[[rules]]
id = "bewatu-jwt-secret"
description = "JWT signing secret"
regex = '''(?i)(jwt[_-]?secret|JWT_SECRET)\s*[:=]\s*['\"]?[A-Za-z0-9+/=_-]{20,}['\"]?'''
tags = ["jwt", "auth"]
severity = "CRITICAL"

[allowlist]
description = "Allowlisted paths and patterns"
paths = [
  '''.gitleaks.toml''',
  '''gitleaks.toml''',
  '''\.github/''',
  '''node_modules/''',
  '''\.next/''',
  '''dist/''',
  '''build/''',
]
regexes = [
  # Firebase client config keys are intentionally public
  '''AIzaSy[A-Za-z0-9_-]{33}''',
]
commits = []
