# .github/workflows/security.yml
# Apply to ALL THREE repos: BeWatu_V3, bewatu-factory-main-3, bewatu-ops
#
# Required GitHub Secrets:
#   BEWATU_SECURITY_TOKEN   — ops agent token for posting findings
#   FIREBASE_TOKEN          — for rules emulator tests
#   VERCEL_TOKEN            — for posture checks
#   GITLEAKS_LICENSE        — optional, free for OSS repos
#   SEMGREP_APP_TOKEN       — optional, for Semgrep dashboard

name: Security scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  # gitleaks-action lists the PR's commits via the GitHub API on some
  # pull_request runs (confirmed 403 "Resource not accessible by
  # integration" on the equivalent workflow in bewatu-factory/bewatu-ops —
  # this repo's PRs so far happened to take a different, single-commit code
  # path that skips the API call, but that's not something to rely on).
  pull-requests: read

jobs:

  # ── 1. Secrets scan ────────────────────────────────────────────────────────
  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── 2. Code analysis ───────────────────────────────────────────────────────
  code-analysis:
    name: Semgrep
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif }
        continue-on-error: true
      - name: Send findings to BeWatu
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (!process.env.BEWATU_SECURITY_TOKEN) { console.log('No token — skipping'); process.exit(0); }
            const sarif = JSON.parse(fs.readFileSync('semgrep.sarif','utf-8'));
            const results = sarif.runs?.flatMap(r=>r.results||[])||[];
            console.log('Findings:', results.length);
            if (!results.length) process.exit(0);
            const repo = '${{ github.repository }}'.includes('factory') ? 'bewatu_factory' : '${{ github.repository }}'.includes('ops') ? 'bewatu_ops' : 'bewatu_v3';
            Promise.all(results.slice(0,20).map(r=>
              fetch(process.env.BEWATU_SECURITY_URL,{
                method:'POST',
                headers:{'Content-Type':'application/json','Authorization':'Bearer '+process.env.BEWATU_SECURITY_TOKEN},
                body:JSON.stringify({
                  sensor:'code-analysis',category:'vulnerability',
                  severity: r.level==='error'?'high':'medium',
                  title:'Semgrep: '+(r.ruleId||'unknown'),
                  description:r.message?.text||r.ruleId,repo,
                  evidence:{filePath:r.locations?.[0]?.physicalLocation?.artifactLocation?.uri,lineNumber:r.locations?.[0]?.physicalLocation?.region?.startLine,ruleId:r.ruleId},
                })
              })
            )).then(()=>console.log('Posted.')).catch(e=>console.error(e.message));
          "
        env:
          BEWATU_SECURITY_TOKEN: ${{ secrets.BEWATU_SECURITY_TOKEN }}
          BEWATU_SECURITY_URL: https://www.bewatu.com/api/security/finding

  # ── 3. Dependency audit ────────────────────────────────────────────────────
  dependencies:
    name: Dependency risk
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        run: npm install --legacy-peer-deps
      - name: npm audit
        run: npm audit --json > npm-audit.json || true
      - name: Block on CRITICAL CVEs
        run: |
          CRITICAL=$(node -e "
            try{const r=require('./npm-audit.json');console.log(Object.values(r.vulnerabilities||{}).filter(v=>v.severity==='critical').length);}catch{console.log(0);}
          ")
          echo "Critical CVEs: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then echo "::error::$CRITICAL critical CVEs found."; exit 1; fi
      - name: Send findings
        if: always()
        run: |
          node -e "
            const fs=require('fs');
            if (!process.env.BEWATU_SECURITY_TOKEN){console.log('No token');process.exit(0);}
            try{
              const audit=JSON.parse(fs.readFileSync('npm-audit.json','utf-8'));
              const entries=Object.entries(audit.vulnerabilities||{}).filter(([,v])=>['critical','high','moderate'].includes(v.severity));
              console.log('Vulnerable packages:',entries.length);
              if(!entries.length)process.exit(0);
              const repo='${{ github.repository }}'.includes('factory')?'bewatu_factory':'${{ github.repository }}'.includes('ops')?'bewatu_ops':'bewatu_v3';
              Promise.all(entries.slice(0,10).map(([name,v])=>
                fetch(process.env.BEWATU_SECURITY_URL,{
                  method:'POST',
                  headers:{'Content-Type':'application/json','Authorization':'Bearer '+process.env.BEWATU_SECURITY_TOKEN},
                  body:JSON.stringify({sensor:'dependency-risk',category:'dependency_risk',severity:v.severity==='moderate'?'medium':v.severity,title:'Vulnerable dependency: '+name,description:(v.via?.[0]?.title)||('Vulnerability in '+name),repo,evidence:{snippet:name+'@'+(v.range||'unknown')}}),
                })
              )).then(()=>console.log('Posted.')).catch(e=>console.error(e.message));
            }catch(e){console.log('No results:',e.message);}
          "
        env:
          BEWATU_SECURITY_TOKEN: ${{ secrets.BEWATU_SECURITY_TOKEN }}
          BEWATU_SECURITY_URL: https://www.bewatu.com/api/security/finding

  # ── 4. Firestore rules — real behavioral tests, not a text lint ───────────
  # Deliberately NOT gated on `needs: secrets` — that job has been failing
  # independently for months (gitleaks finds something in git history that
  # needs its own investigation) and rules correctness doesn't depend on it.
  # A regex "no `if true`" lint used to live here; it would not have caught
  # any of the real bugs found in the 2026-09 rules review (a missing brace
  # that silently dead-ended ~48 collections, open-write rules on several
  # factory_* collections, a field-name mismatch that would have blocked
  # every investor application). This runs the actual rule engine instead.
  firestore-rules:
    name: Firestore rules test (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Install rules-test dependencies
        run: npm install --prefix test/rules
      - name: Install messaging-test dependencies
        run: npm install --prefix test/messaging
      - name: Install pods-test dependencies
        run: npm install --prefix test/pods
      - name: Install engagement-counters-test dependencies
        run: npm install --prefix test/engagement-counters
      - name: Install notification-injection-test dependencies
        run: npm install --prefix test/notification-injection
      - name: Install privilege-escalation-test dependencies
        run: npm install --prefix test/privilege-escalation
      - name: Run rules tests against the Firestore emulator
        run: firebase emulators:exec --project demo-bewatu --only firestore "node test/rules/run-tests.js"
      - name: Run messaging tests against the Firestore emulator
        # P0 11: subscribeToMessageThreads' query + preview derivation, run
        # against the real rules engine (same array-contains query the old
        # fetchAllMessagesForUser used, so no new rule surface).
        run: firebase emulators:exec --project demo-bewatu --only firestore "node test/messaging/run-tests.js"
      - name: Run pods tests against the Firestore emulator
        # P0 11: joinOpenCircle/removeMemberFromCircle actually write to
        # Firestore now, instead of the old setData(...)-only handlers.
        run: firebase emulators:exec --project demo-bewatu --only firestore "node test/pods/run-tests.js"
      - name: Run engagement-counters tests against the Firestore emulator
        # P1: onlyFields(['reactions'|'appreciations'|'viewCount'|...]) used
        # to let any authed non-owner set these fields to any value, not
        # just bump them — now requires the real self-toggle/increment
        # shape each app write site actually uses.
        run: firebase emulators:exec --project demo-bewatu --only firestore "node test/engagement-counters/run-tests.js"
      - name: Run notification-injection tests against the Firestore emulator
        # P1: users/{uid}/notifications and the legacy notifications/{uid}/
        # items were both `allow create: if isAuth()` — any signed-in user
        # could write anything into any other user's notification feed.
        run: firebase emulators:exec --project demo-bewatu --only firestore "node test/notification-injection/run-tests.js"
      - name: Run privilege-escalation tests against the Firestore emulator
        # CRITICAL: users/{uid} create/update had zero field restrictions —
        # any authenticated user could set isPlatformAdmin: true on their
        # own doc (even at account-creation time), which ~40 other rules
        # across this file read as an escalated-privilege bypass.
        run: firebase emulators:exec --project demo-bewatu --only firestore "node test/privilege-escalation/run-tests.js"

  # ── 5. Cloud posture ───────────────────────────────────────────────────────
  posture:
    name: Cloud posture
    needs: [code-analysis, dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check for NEXT_PUBLIC_ secrets
        run: |
          node -e "
            const fs=require('fs'),path=require('path');
            const PAT=/KEY|SECRET|TOKEN|PASSWORD|ACCOUNT|STRIPE|FIREBASE/i;
            let found=0;
            const check=dir=>{
              if(!fs.existsSync(dir))return;
              fs.readdirSync(dir,{withFileTypes:true}).forEach(f=>{
                if(f.isDirectory()&&!['node_modules','.git','dist','.next'].includes(f.name))check(path.join(dir,f.name));
                else if(f.isFile()&&(f.name.endsWith('.env')||f.name.endsWith('.env.local'))){
                  fs.readFileSync(path.join(dir,f.name),'utf-8').split('\n').forEach((line,i)=>{
                    const[key]=line.split('=');
                    if(key?.startsWith('NEXT_PUBLIC_')&&PAT.test(key)){console.error('Secret in NEXT_PUBLIC_: '+key);found++;}
                  });
                }
              });
            };
            check('.');
            if(found>0)process.exit(1);
            else console.log('Posture check passed.');
          "
