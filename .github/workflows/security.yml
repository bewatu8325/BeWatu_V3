# .github/workflows/security.yml
# Apply to ALL THREE repos: BeWatu_V3, bewatu-factory-main-3, bewatu-ops
#
# Required GitHub Secrets:
#   BEWATU_SECURITY_TOKEN   — ops agent token for posting findings
#   FIREBASE_TOKEN          — for rules emulator tests
#   VERCEL_TOKEN            — for posture checks
#   GITLEAKS_LICENSE        — optional, free for OSS repos
#   SEMGREP_APP_TOKEN       — optional, for Semgrep dashboard

name: Security scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:

  # ── 1. Secrets scan ────────────────────────────────────────────────────────
  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── 2. Code analysis ───────────────────────────────────────────────────────
  code-analysis:
    name: Semgrep
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif }
        continue-on-error: true
      - name: Send findings to BeWatu
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (!process.env.BEWATU_SECURITY_TOKEN) { console.log('No token — skipping'); process.exit(0); }
            const sarif = JSON.parse(fs.readFileSync('semgrep.sarif','utf-8'));
            const results = sarif.runs?.flatMap(r=>r.results||[])||[];
            console.log('Findings:', results.length);
            if (!results.length) process.exit(0);
            const repo = '${{ github.repository }}'.includes('factory') ? 'bewatu_factory' : '${{ github.repository }}'.includes('ops') ? 'bewatu_ops' : 'bewatu_v3';
            Promise.all(results.slice(0,20).map(r=>
              fetch(process.env.BEWATU_SECURITY_URL,{
                method:'POST',
                headers:{'Content-Type':'application/json','Authorization':'Bearer '+process.env.BEWATU_SECURITY_TOKEN},
                body:JSON.stringify({
                  sensor:'code-analysis',category:'vulnerability',
                  severity: r.level==='error'?'high':'medium',
                  title:'Semgrep: '+(r.ruleId||'unknown'),
                  description:r.message?.text||r.ruleId,repo,
                  evidence:{filePath:r.locations?.[0]?.physicalLocation?.artifactLocation?.uri,lineNumber:r.locations?.[0]?.physicalLocation?.region?.startLine,ruleId:r.ruleId},
                })
              })
            )).then(()=>console.log('Posted.')).catch(e=>console.error(e.message));
          "
        env:
          BEWATU_SECURITY_TOKEN: ${{ secrets.BEWATU_SECURITY_TOKEN }}
          BEWATU_SECURITY_URL: https://www.bewatu.com/api/security/finding

  # ── 3. Dependency audit ────────────────────────────────────────────────────
  dependencies:
    name: Dependency risk
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        run: npm install --legacy-peer-deps
      - name: npm audit
        run: npm audit --json > npm-audit.json || true
      - name: Block on CRITICAL CVEs
        run: |
          CRITICAL=$(node -e "
            try{const r=require('./npm-audit.json');console.log(Object.values(r.vulnerabilities||{}).filter(v=>v.severity==='critical').length);}catch{console.log(0);}
          ")
          echo "Critical CVEs: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then echo "::error::$CRITICAL critical CVEs found."; exit 1; fi
      - name: Send findings
        if: always()
        run: |
          node -e "
            const fs=require('fs');
            if (!process.env.BEWATU_SECURITY_TOKEN){console.log('No token');process.exit(0);}
            try{
              const audit=JSON.parse(fs.readFileSync('npm-audit.json','utf-8'));
              const entries=Object.entries(audit.vulnerabilities||{}).filter(([,v])=>['critical','high','moderate'].includes(v.severity));
              console.log('Vulnerable packages:',entries.length);
              if(!entries.length)process.exit(0);
              const repo='${{ github.repository }}'.includes('factory')?'bewatu_factory':'${{ github.repository }}'.includes('ops')?'bewatu_ops':'bewatu_v3';
              Promise.all(entries.slice(0,10).map(([name,v])=>
                fetch(process.env.BEWATU_SECURITY_URL,{
                  method:'POST',
                  headers:{'Content-Type':'application/json','Authorization':'Bearer '+process.env.BEWATU_SECURITY_TOKEN},
                  body:JSON.stringify({sensor:'dependency-risk',category:'dependency_risk',severity:v.severity==='moderate'?'medium':v.severity,title:'Vulnerable dependency: '+name,description:(v.via?.[0]?.title)||('Vulnerability in '+name),repo,evidence:{snippet:name+'@'+(v.range||'unknown')}}),
                })
              )).then(()=>console.log('Posted.')).catch(e=>console.error(e.message));
            }catch(e){console.log('No results:',e.message);}
          "
        env:
          BEWATU_SECURITY_TOKEN: ${{ secrets.BEWATU_SECURITY_TOKEN }}
          BEWATU_SECURITY_URL: https://www.bewatu.com/api/security/finding

  # ── 4. Firestore rules lint ────────────────────────────────────────────────
  firestore-rules:
    name: Firestore rules lint
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Lint rules
        run: |
          node -e "
            const fs=require('fs');
            if(!fs.existsSync('firestore.rules')){console.log('No firestore.rules — skipping.');process.exit(0);}
            const rules=fs.readFileSync('firestore.rules','utf-8');
            let errors=0;
            rules.split('\n').forEach((line,i)=>{
              if(/allow\s+\w.*:\s*if\s+true/.test(line)){
                console.error('CRITICAL line '+(i+1)+': Unconditional allow — '+line.trim());
                errors++;
              }
            });
            if(errors>0){console.error(errors+' critical issue(s).');process.exit(1);}
            else console.log('Firestore rules lint passed.');
          "

  # ── 5. Cloud posture ───────────────────────────────────────────────────────
  posture:
    name: Cloud posture
    needs: [code-analysis, dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check for NEXT_PUBLIC_ secrets
        run: |
          node -e "
            const fs=require('fs'),path=require('path');
            const PAT=/KEY|SECRET|TOKEN|PASSWORD|ACCOUNT|STRIPE|FIREBASE/i;
            let found=0;
            const check=dir=>{
              if(!fs.existsSync(dir))return;
              fs.readdirSync(dir,{withFileTypes:true}).forEach(f=>{
                if(f.isDirectory()&&!['node_modules','.git','dist','.next'].includes(f.name))check(path.join(dir,f.name));
                else if(f.isFile()&&(f.name.endsWith('.env')||f.name.endsWith('.env.local'))){
                  fs.readFileSync(path.join(dir,f.name),'utf-8').split('\n').forEach((line,i)=>{
                    const[key]=line.split('=');
                    if(key?.startsWith('NEXT_PUBLIC_')&&PAT.test(key)){console.error('Secret in NEXT_PUBLIC_: '+key);found++;}
                  });
                }
              });
            };
            check('.');
            if(found>0)process.exit(1);
            else console.log('Posture check passed.');
          "
