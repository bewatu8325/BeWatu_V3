# .github/workflows/ci.yml
# BeWatu_V3 only — repo-specific (unlike security.yml, which is shared
# verbatim across BeWatu_V3, bewatu-factory, and bewatu-ops).
#
# Typechecks and builds the app on every push/PR. Three API route files are
# excluded from the typecheck via tsconfig.json's "exclude" (with a comment
# there explaining why — see that file); every other errored file was either
# genuinely dead code (deleted) or a real bug (fixed), not cast away.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit -p .
      - name: Build
        run: npm run build
