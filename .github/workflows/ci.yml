# .github/workflows/ci.yml
# BeWatu_V3 only — repo-specific (unlike security.yml, which is shared
# verbatim across BeWatu_V3, bewatu-factory, and bewatu-ops).
#
# Typechecks and builds the app on every push/PR. Three API route files are
# excluded from the app typecheck via tsconfig.json's "exclude" (with a
# comment there explaining why — see that file); every other errored file
# was either genuinely dead code (deleted) or a real bug (fixed), not cast
# away. functions/ (Cloud Functions) is a separate TS project with its own
# tsconfig/package.json/node_modules — it gets its own install + typecheck
# job below rather than being swept into the root one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit -p .
      - name: Build
        run: npm run build

  functions-typecheck:
    name: Typecheck functions/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # functions/package.json declares engines.node: "22" (the real
        # deploy runtime — Firebase's own deploy output confirms "Node.js 22
        # (2nd Gen)"), and firebase-admin >=14 declares the same >=22
        # requirement. Node 20 here isn't just a mismatched-but-harmless
        # pin: firebase-admin lists @google-cloud/firestore and
        # @google-cloud/storage as optionalDependencies, and both of THOSE
        # packages also require >=22 — under Node 20, npm silently omits an
        # optional dependency whose own engines check fails (no error, no
        # warning about the omission itself), so their type declarations
        # simply aren't there for firebase-admin's own .d.ts files to
        # import. Reproduced this precisely: downloaded the real Node 20
        # binary CI uses, ran a clean install, confirmed
        # node_modules/@google-cloud/ doesn't even exist afterward, and got
        # the exact same TS2307 "Cannot find module '@google-cloud/
        # firestore'" this job was failing on.
        with: { node-version: '22' }
      - name: Install functions/ dependencies
        run: npm install --prefix functions
      - name: Typecheck functions/ (tsc --noEmit)
        # Must run from inside functions/ — this job never installs the
        # root's node_modules, so a root-relative `npx tsc` finds no local
        # `typescript` and falls back to fetching an unrelated npm package
        # literally named "tsc" from the registry (confirmed on this exact
        # job: "This is not the tsc command you are looking for"). Running
        # from functions/ resolves functions/node_modules/typescript, which
        # functions/package.json already depends on directly.
        run: cd functions && npx tsc --noEmit -p .

  # Tests for the server routes, scripts and pure logic added since the rules suites in security.yml.
  # Each step is its own suite so a failure names the feature. The emulator ones run against the real
  # Firestore emulator (no network, no production credentials: project demo-bewatu).
  server-tests:
    name: Server route and logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Install firebase-tools and tsx
        run: npm install -g firebase-tools tsx

      # ── no emulator needed ──
      - name: Mobile feed suggestions
        run: tsx test/mobile-feed/run-tests.mjs
      - name: Compliance bundle encryption
        run: tsx test/compliance-bundle/run-tests.mjs
      - name: PII scan accuracy and output safety
        run: node test/pii-scan/run-tests.mjs

      # ── against the Firestore emulator ──
      - name: Companies / organizations directory API
        run: firebase emulators:exec --project demo-bewatu --only firestore "tsx test/companies-directory/run-tests.mjs"
      - name: Organization model, categories, filters and snapshot
        run: firebase emulators:exec --project demo-bewatu --only firestore "tsx test/organizations/run-tests.mjs"
      - name: Organization importer
        run: firebase emulators:exec --project demo-bewatu --only firestore "tsx test/org-import/run-tests.mjs"
      - name: Arena sponsorship
        run: firebase emulators:exec --project demo-bewatu --only firestore "tsx test/arena-sponsorship/run-tests.mjs"
      - name: Link previews
        run: firebase emulators:exec --project demo-bewatu --only firestore "tsx test/link-preview/run-tests.mjs"
      - name: Ops communications and unsubscribe
        run: firebase emulators:exec --project demo-bewatu --only firestore "tsx test/ops-comms/run-tests.mjs"
      - name: Email preferences, unsubscribe and resubscribe
        run: firebase emulators:exec --project demo-bewatu --only firestore "tsx test/email-preferences/run-tests.mjs"
      - name: Ops user-data route
        run: firebase emulators:exec --project demo-bewatu --only firestore "tsx test/ops-user-data/run-tests.mjs"
      - name: Legacy PII purge script (unit)
        run: node test/purge-legacy-pii/run-tests.mjs
      - name: Legacy PII purge script (emulator)
        run: firebase emulators:exec --project demo-bewatu --only firestore "node test/purge-legacy-pii/run-tests.mjs"
