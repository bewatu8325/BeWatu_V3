# Keeps the GitHub Actions used by our workflows up to date (and flags ones with known vulnerabilities).
# Each update arrives as a normal pull request that must pass CI before it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
